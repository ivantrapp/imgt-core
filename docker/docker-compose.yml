version: '3.8'

services:

  postgres:
    image: postgres:16-alpine
    container_name: imgt-postgres
    environment:
      POSTGRES_DB: imgt_db
      POSTGRES_USER: imgt_user
      POSTGRES_PASSWORD: imgt_password
    ports:
      - "8000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - imgt-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U imgt_user -d imgt_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for Session Management
  redis:
    image: redis:7-alpine
    container_name: imgt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - imgt-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
