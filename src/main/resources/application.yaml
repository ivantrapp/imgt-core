spring:
  application:
    name: imgt
  datasource:
    url: jdbc:postgresql://localhost:8000/imgt_db
    username: imgt_user
    password: imgt_password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
      password:
      timeout: 60000
  session:
    store-type: redis
    timeout: 30m
  cloud:
    aws:
      region:
        static: us-east-2
    credentials:
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}
    sqs:
      enabled: true
      # Configurações específicas para FIFO
      listener:
        max-concurrent-messages: 1  # FIFO processa em ordem, geralmente 1 por vez
        max-messages-per-poll: 10
    sns:
      enabled: true

aws:
  sns:
    topic:
      arn-fifo: arn:aws:sns:us-east-2:266933065489:imgt-sns.fifo
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.springframework.security: DEBUG
    com.imgt: DEBUG

# Server Configuration
server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always